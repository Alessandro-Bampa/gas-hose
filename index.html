  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <link rel="stylesheet" href="css/style.css">

<body class="gated">

    </a>
    <nav class="tabs" aria-label="Sezioni">

  <input type="file" id="import-input" accept=".xlsx,.json,.zip" multiple hidden>

  <script src="js/xlsx-lite.js"></script>
  <script src="js/model.js"></script>
  <script src="js/store.js"></script>
